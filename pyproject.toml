[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcmodel"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "torch",
    "matplotlib",
    "optuna",
    "shap",
    "xgboost",
]

[tool.setuptools.packages.find]
where = ["src"]